<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>KikoПицца — Доставка</title>
    <!-- Подключаем наш отдельный файл со стилями CSS -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="logo">KikoПицца</div>
        <nav>
            <a href="/login" class="lk-button">Личный кабинет</a>
        </nav>
    </header>
    
    <div class="container">
        <h2>Меню</h2>
        <div class="pizza-container">
            <div class="pizza-card">
                <img class="pizza-img" src="https://unsplash.com" alt="Маргарита">
                <div class="pizza-info">
                    <div>
                        <h3 class="pizza-title">Маргарита</h3>
                        <p class="pizza-desc">Классический рецепт: итальянские томаты, неженейшая моцарелла и свежий базилик на тонком тесте.</p>
                    </div>
                    <div class="pizza-footer">
                        <span class="price">450 ₽</span>
                        <button>В корзину</button>
                    </div>
                </div>
            </div>
            
            <div class="pizza-card">
                <img class="pizza-img" src="https://unsplash.com" alt="Пепперони">
                <div class="pizza-info">
                    <div>
                        <h3 class="pizza-title">Пепперони</h3>
                        <p class="pizza-desc">Пикантная и острая колбаска пепперони, увеличенная порция сыра моцарелла и фирменный томатный соус.</p>
                    </div>
                    <div class="pizza-footer">
                        <span class="price">550 ₽</span>
                        <button>В корзину</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
